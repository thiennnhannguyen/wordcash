# PostgreSQL + Redis cho môi trường dev. Backend FastAPI chạy ngoài Docker: uvicorn app.main:asgi_app --reload

services:
  postgres:
    image: postgres:15-alpine
    container_name: wordclash_postgres
    restart: always
    environment:
      POSTGRES_USER: wordclash
      POSTGRES_PASSWORD: wordclash_password
      POSTGRES_DB: wordclash_db
    ports:
      # Cổng 5433 trên máy để không đụng PostgreSQL cài sẵn (thường chiếm 5432)
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Tạo thêm database wordclash_test khi khởi tạo volume lần đầu.
      # Volume đã có từ trước: docker exec wordclash_postgres createdb -U wordclash wordclash_test
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordclash -d wordclash_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wordclash_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

