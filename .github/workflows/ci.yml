# CI: chạy khi push hoặc mở pull request.
# - backend: PostgreSQL + Redis (service containers) → alembic upgrade head → pytest (database test riêng wordclash_test).
# - frontend: npm ci → npm test (dữ liệu thuần) → npm run build (postbuild kiểm tra dist không chứa chuỗi dev).
# Chưa chạy e2e (Playwright) trên CI.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (alembic + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wordclash
          POSTGRES_PASSWORD: wordclash_ci
          POSTGRES_DB: wordclash_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wordclash -d wordclash_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Chỉ dùng trong CI (database tạm của service container), không phải bí mật thật
      DATABASE_URL: postgresql+asyncpg://wordclash:wordclash_ci@localhost:5432/wordclash_db
      TEST_DATABASE_URL: postgresql+asyncpg://wordclash:wordclash_ci@localhost:5432/wordclash_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-key-not-used-anywhere-else
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Cài thư viện
        run: pip install -r requirements.txt
      - name: Tạo database test
        env:
          PGPASSWORD: wordclash_ci
        run: createdb -h localhost -U wordclash wordclash_test
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: Migration chỉ có một head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: pytest
        run: pytest -q

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build
